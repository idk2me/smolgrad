name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      # The test suite is pure stdlib, so skip installing the locked
      # dependencies (numpy/matplotlib/torchvision are only used by the
      # notebook). uv still honors .python-version and downloads a
      # managed CPython 3.14 interpreter.
      - name: Run unit tests
        run: uv run --no-project python -m unittest
